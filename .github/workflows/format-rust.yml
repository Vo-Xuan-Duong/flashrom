name: Format Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-rust.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit formatting when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          if git diff --cached --quiet; then
            echo "Rust sources already formatted."
          else
            git commit -m "style: apply cargo fmt"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

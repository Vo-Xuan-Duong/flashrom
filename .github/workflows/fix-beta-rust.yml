name: Apply beta Rust integration fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-beta-rust.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Keep executor internal and clean ZIP import
        shell: python
        run: |
          from pathlib import Path

          executor = Path("src-tauri/src/executor.rs")
          text = executor.read_text(encoding="utf-8")
          needle = "#[tauri::command]\npub async fn execute_full_rom("
          if needle not in text:
              raise SystemExit("executor command marker not found")
          executor.write_text(text.replace(needle, "pub async fn execute_full_rom(", 1), encoding="utf-8")

          archive = Path("src-tauri/src/zip_inspection.rs")
          text = archive.read_text(encoding="utf-8")
          archive.write_text(text.replace("path::{Path, PathBuf},", "path::PathBuf,"), encoding="utf-8")

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit integration fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "fix: expose only verified Full-ROM executor"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

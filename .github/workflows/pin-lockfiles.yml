name: Pin dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - .github/workflows/pin-lockfiles.yml

permissions:
  contents: write

concurrency:
  group: pin-lockfiles-main
  cancel-in-progress: true

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit lockfiles when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi

          git commit -m "chore: pin dependency lockfiles"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

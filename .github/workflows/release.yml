name: Release Windows

on:
  workflow_dispatch:
    inputs:
      hardware_validation_confirmed:
        description: Confirm the beta hardware validation checklist has been completed
        required: true
        type: boolean
        default: false
      unsigned_beta_acknowledged:
        description: Acknowledge that installers are unsigned unless Tauri signing secrets are configured
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows
    if: ${{ inputs.hardware_validation_confirmed && inputs.unsigned_beta_acknowledged }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm check

      - name: Test frontend IPC contracts
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Rust backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build installers and draft GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: FlashROM v__VERSION__
          releaseBody: |
            Windows beta release of FlashROM.

            Beta release gates require the hardware validation checklist to be acknowledged before this workflow runs.
            Installers may be unsigned unless Windows/Tauri signing credentials are configured for the repository.
            Review README, SECURITY.md and docs/BETA-VALIDATION.md before flashing a real device.
          releaseDraft: true
          prerelease: true
          args: --bundles nsis,msi
